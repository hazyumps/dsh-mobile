name: DSHRemote
options:
  bundleIdPrefix: net.fernlabs
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Set DEVELOPMENT_TEAM (or pick a team in Xcode) before installing on a
    # device. Simulator builds need no identity at all.
    DEVELOPMENT_TEAM: "U6LC736TBG"

packages:
  DSHRemoteKit:
    path: ../..

targets:
  DSHRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: DSHRemoteKit
        product: DSHRemoteKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DSH Remote
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "238"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: DSH Remote reaches your DeepSeek Harness on the local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fernlabs.dshremote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO

  # Render tests for bugs that live only in a view's modifiers (#74). Hosted in the app, so
  # `@testable import DSHRemote` reaches internal views. Rules still belong in the kit and its
  # `swift test` suite; this target is for what only rendering the real view can catch.
  # Tools/check.sh runs it on the dedicated "DSH Remote Tests" simulator.
  DSHRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../Tests/DSHRemoteTests
    dependencies:
      - target: DSHRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fernlabs.dshremote.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DSHRemote:
    build:
      targets:
        DSHRemote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DSHRemoteTests
